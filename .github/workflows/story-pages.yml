name: BNW Story Build, Verify & Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bnw-github-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required B001 story assets and navigation
        shell: bash
        run: |
          set -euo pipefail
          for p in README.md index.html chapter-atlas.html living-kernel.html engine/story-engine.js episodes/B001-the-hatchery.html witness-crosswalk-001.html episodes/B002-the-conditioning-rooms.html witness-crosswalk-002.html kernel/registry.json; do
            test -s "$p"
            echo "PASS $p"
          done
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json, re
          root=Path(".")
          reg=json.loads(Path("kernel/registry.json").read_text())
          assert reg["schema"]=="bnw.living-registry.v1"
          assert reg["canon"]["playable_book_chapters"]==2
          assert reg["canon"]["witness_crosswalks"]==2
          assert len(reg["chapter_map"])==18
          for chapter in ("B001-the-hatchery","B002-the-conditioning-rooms"):
            c=Path("episodes/"+chapter+".html").read_text()
            found=re.search(r'window\.BNW_CHAPTER=(\{.*?\});</script>',c,re.S)
            assert found, f"{chapter} missing story dataset"
            data=json.loads(found.group(1))
            assert data["id"]==chapter[:4] and len(data["scenes"])==7
            assert all(all(k in scene for k in ("title","narration","dialogue","evidence","fact","inference","answers","responses","mode")) for scene in data["scenes"])
            assert all(len(scene["answers"])==len(scene["responses"])==2 for scene in data["scenes"])
          import hashlib
          for a in reg["assets"]:
            p=root/a["path"]
            assert p.is_file(),a["path"]
            raw=p.read_bytes()
            sha=hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()
            assert sha==a["git_blob_sha"],(p,sha,a["git_blob_sha"])
          class Links(HTMLParser):
            def __init__(self): super().__init__();self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag in ("a","script","link"):
                self.links += [v for k,v in attrs if k in ("href","src") and v and not v.startswith(("http:","https:","#","mailto:"))]
          files=["index.html","chapter-atlas.html","living-kernel.html","episodes/B001-the-hatchery.html","episodes/B002-the-conditioning-rooms.html","witness-crosswalk-001.html","witness-crosswalk-002.html"]
          for name in files:
            q=root/name
            parser=Links();parser.feed(q.read_text())
            for l in parser.links:
              target=q.parent/l.split("?")[0].split("#")[0]
              if l and not target.exists(): raise AssertionError(f"Broken link: {name} -> {l}")
          print("PASS: 14 unique story acts; 18 mapped; 7 Git blob IDs; local links")
          PY
      - name: Verify all browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check engine/story-engine.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          Path('/tmp/bnw-inline').mkdir(exist_ok=True)
          files=["index.html","living-kernel.html","episodes/B001-the-hatchery.html","episodes/B002-the-conditioning-rooms.html","witness-crosswalk-001.html","witness-crosswalk-002.html"]
          n=0
          for fname in files:
            content=Path(fname).read_text(encoding="utf-8")
            for raw in re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", content,flags=re.I):
              if raw.strip():
                Path(f"/tmp/bnw-inline/{n}.js").write_text(raw,encoding="utf-8")
                n+=1
          print(f"Created {n} inline JS syntax targets")
          PY
          for f in /tmp/bnw-inline/*.js; do node --check "$f"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static BNW story to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
