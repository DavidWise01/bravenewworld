name: BNW Living Story Integrity and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bnw-github-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all chapters, witness roots, Git blobs and links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import hashlib, json, re
          root=Path('.').resolve()
          reg=json.loads(Path('kernel/registry.json').read_text(encoding='utf-8'))
          assert reg['schema']=='bnw.living-registry.v1'
          total=reg['canon']['playable_book_chapters']
          assert total==reg['canon']['witness_crosswalks']
          assert 1<=total<=18 and len(reg['chapter_map'])==18
          slugs=[
            'the-hatchery','the-conditioning-rooms','the-world-state',
            'bernard-and-helmholtz','the-solidarity-ritual',
            'the-reservation-journey','the-reservation','johns-story',
            'the-sleeping-visitor','the-directors-confrontation','londons-new-curiosity'
          ]
          assert total<=len(slugs), 'Add new chapter slug to audit table'
          expected={f'episodes/B{i:03d}-{slugs[i-1]}.html' for i in range(1,total+1)}
          expected|={f'witness-crosswalk-{i:03d}.html' for i in range(1,total+1)}
          expected|={'engine/story-engine.js','index.html','chapter-atlas.html'}
          paths={a['path'] for a in reg['assets']}
          assert paths==expected,(sorted(expected-paths),sorted(paths-expected))
          for a in reg['assets']:
            p=Path(a['path'])
            assert p.is_file(),f'Missing {p}'
            raw=p.read_bytes()
            actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            assert actual==a['git_blob_sha'],f'Git blob mismatch {p}'
          for i in range(1,total+1):
            p=Path(f'episodes/B{i:03d}-{slugs[i-1]}.html')
            content=p.read_text(encoding='utf-8')
            m=re.search(r'window\.BNW_CHAPTER=(\{.*?\});</script>',content,re.S)
            assert m,f'Missing story payload: {p}'
            data=json.loads(m.group(1))
            assert data['id']==f'B{i:03d}'
            assert len(data['scenes'])==7,f'Expected 7 acts: {p}'
            for s in data['scenes']:
              assert all(k in s for k in ('title','short','narration','dialogue','evidence','fact','inference','answers','responses','mode')),p
              assert len(s['answers'])==len(s['responses'])==2,p
          class Links(HTMLParser):
            def __init__(self): super().__init__();self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag in ('a','script','link','img'):
                self.links.extend(v for k,v in attrs if k in ('href','src') and v)
          for path in ['index.html','chapter-atlas.html','living-kernel.html']+[f'episodes/B{i:03d}-{slugs[i-1]}.html' for i in range(1,total+1)]+[f'witness-crosswalk-{i:03d}.html' for i in range(1,total+1)]:
            doc=Path(path)
            parser=Links();parser.feed(doc.read_text(encoding='utf-8'))
            for ref in parser.links:
              url=urlsplit(ref)
              if url.scheme or url.netloc or ref.startswith(('#','/','mailto:')) or not url.path: continue
              target=(doc.parent/unquote(url.path)).resolve()
              assert target.is_relative_to(root),f'Path traversal: {path} -> {ref}'
              assert target.exists(),f'Broken local link: {path} -> {ref}'
          print(f'PASS {total} playable chapters, {7*total} acts, {total} crosswalks, {len(paths)} canonical Git blob hashes and local links.')
          PY
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check engine/story-engine.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=Path('/tmp/bnw-inline')
          out.mkdir(exist_ok=True)
          paths=[Path('index.html'),Path('living-kernel.html')]
          paths+=list(Path('episodes').glob('B*.html'))
          paths+=list(Path('.').glob('witness-crosswalk-*.html'))
          n=0
          for path in paths:
            for script in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',path.read_text(encoding='utf-8'),flags=re.I):
              if not script.strip():continue
              (out/f'{n:03d}.js').write_text(script,encoding='utf-8')
              n+=1
          print(f'Generated {n} inline script checks')
          PY
          for f in /tmp/bnw-inline/*.js; do node --check "$f"; done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy story archive to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
